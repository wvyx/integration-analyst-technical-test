openapi: 3.1.0
info:
  title: PT. XYZ Fintech - Loan Origination API
  version: 1.0.0
  description: >
    Spesifikasi kontrak API (OpenAPI 3.1) untuk fitur pengajuan pinjaman online
    yang menghubungkan Mobile App / Microservices dengan Core Banking System.
  contact:
    name: Integration Architecture Team - PT. XYZ

servers:
  - url: https://api.ptxyz-fintech.co.id/api/v1
    description: Production API Gateway
  - url: https://sandbox-api.ptxyz-fintech.co.id/api/v1
    description: Sandbox / UAT Environment

tags:
  - name: Loan Origination
    description: Endpoint pengelolaan pengajuan dan pembentukan fasilitas pinjaman

paths:
  /loans/applications:
    post:
      summary: Mengajukan pinjaman online baru
      description: >
        Memvalidasi kelayakan kredit nasabah dan meneruskan instruksi pembentukan
        rekening pinjaman ke Core Banking System melalui lapisan SOA.
      operationId: submitLoanApplication
      tags:
        - Loan Origination
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: UUID unik untuk mencegah duplikasi pengajuan/pencairan dana.
          schema:
            type: string
            format: uuid
            example: "8f14e45f-ea9b-41a2-9c12-112233445566"
        - name: X-Correlation-ID
          in: header
          required: true
          description: UUID pelacakan transaksi end-to-end untuk monitoring di Kibana.
          schema:
            type: string
            format: uuid
            example: "corr-9981-44ab-812c-77889900aabb"
        - name: X-Signature
          in: header
          required: true
          description: HMAC-SHA256 signature untuk menjamin integritas payload.
          schema:
            type: string
            example: "a94a8fe5ccb19ba61c4c0873d391e987982fbbd3"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoanApplicationRequest'
      responses:
        '201':
          description: Pengajuan pinjaman berhasil diproses dan tercatat di Core Banking.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanApplicationSuccessResponse'
        '400':
          description: Format JSON tidak valid atau field wajib tidak lengkap.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Autentikasi gagal (Token JWT tidak valid atau signature salah).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Konflik duplikasi transaksi (Idempotency-Key sudah digunakan).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Pengajuan ditolak berdasarkan aturan bisnis / limit kredit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Gateway Timeout saat berkomunikasi dengan Core Banking System.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoanApplicationRequest:
      type: object
      required:
        - customerId
        - loanDetails
        - disbursementAccount
        - consent
      properties:
        customerId:
          type: string
          maxLength: 30
          description: ID unik nasabah yang telah terverifikasi e-KYC.
          example: "CUST-20261121-00981"
        loanDetails:
          type: object
          required:
            - productCode
            - requestedAmount
            - currency
            - tenorMonths
            - loanPurpose
          properties:
            productCode:
              type: string
              example: "PINJOL-REG-01"
            requestedAmount:
              type: number
              minimum: 500000
              maximum: 50000000
              example: 5000000
            currency:
              type: string
              enum: ["IDR"]
              example: "IDR"
            tenorMonths:
              type: integer
              enum: [1, 3, 6, 12]
              example: 6
            interestRatePercent:
              type: number
              example: 2.5
            loanPurpose:
              type: string
              enum: ["KONSUMTIF", "MODAL_USAHA", "PENDIDIKAN", "KESEHATAN"]
              example: "MODAL_USAHA"
        disbursementAccount:
          type: object
          required:
            - bankCode
            - accountNumber
            - accountHolderName
          properties:
            bankCode:
              type: string
              pattern: '^[0-9]{3}$'
              example: "008"
            bankName:
              type: string
              example: "Bank Mandiri"
            accountNumber:
              type: string
              minLength: 10
              maxLength: 16
              example: "1330012345678"
            accountHolderName:
              type: string
              example: "BUDI SANTOSO"
        consent:
          type: object
          required:
            - tncAgreed
            - tncVersion
            - agreedTimestamp
          properties:
            tncAgreed:
              type: boolean
              const: true
              example: true
            tncVersion:
              type: string
              example: "v2.4"
            agreedTimestamp:
              type: string
              format: date-time
              example: "2026-11-21T11:10:00+07:00"

    LoanApplicationSuccessResponse:
      type: object
      properties:
        status:
          type: string
          example: "SUCCESS"
        responseCode:
          type: string
          example: "20100"
        message:
          type: string
          example: "Pengajuan pinjaman berhasil diproses"
        correlationId:
          type: string
          example: "corr-9981-44ab-812c-77889900aabb"
        timestamp:
          type: string
          format: date-time
          example: "2026-11-21T11:10:02+07:00"
        data:
          type: object
          properties:
            applicationId:
              type: string
              example: "APP-20261121-77412"
            coreLoanAccountNumber:
              type: string
              example: "LN-88900112233"
            applicationStatus:
              type: string
              example: "APPROVED_FOR_DISBURSEMENT"
            approvedAmount:
              type: number
              example: 5000000
            adminFee:
              type: number
              example: 150000
            netDisbursementAmount:
              type: number
              example: 4850000
            monthlyInstallment:
              type: number
              example: 958333
            firstDueDate:
              type: string
              format: date
              example: "2026-12-21"

    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: "FAILED"
        responseCode:
          type: string
          example: "42201"
        message:
          type: string
          example: "Nominal pengajuan melebihi sisa limit kredit nasabah"
        correlationId:
          type: string
          example: "corr-9981-44ab-812c-77889900aabb"
        timestamp:
          type: string
          format: date-time
          example: "2026-11-21T11:10:01+07:00"
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: "loanDetails.requestedAmount"
              reason:
                type: string
                example: "Maksimal limit kredit yang tersedia saat ini adalah Rp 3.000.000"
